<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded edges -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Glowing circle ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#neon)" stroke-width="6" stroke-dasharray="20 12" opacity="0.6" />
  
  <!-- Calendar Base Icon -->
  <rect x="136" y="146" width="240" height="230" rx="30" fill="#121829" stroke="#00f0ff" stroke-width="8" filter="url(#glow)" />
  <rect x="136" y="146" width="240" height="70" rx="30" fill="url(#neon)" />
  
  <!-- Calendar Rings -->
  <rect x="186" y="120" width="16" height="46" rx="8" fill="#ffffff" />
  <rect x="310" y="120" width="16" height="46" rx="8" fill="#ffffff" />
  
  <!-- Palm tree & Sun cyber motif inside calendar -->
  <circle cx="216" cy="285" r="26" fill="#00ff66" opacity="0.9" filter="url(#glow)" />
  <path d="M 290 330 Q 256 270 236 240 Q 270 230 310 250 M 256 270 Q 210 240 180 260 M 266 280 Q 300 290 326 310" stroke="#00f0ff" stroke-width="7" fill="none" stroke-linecap="round" />
  <path d="M 260 340 Q 255 290 250 250" stroke="#00ff66" stroke-width="8" fill="none" stroke-linecap="round" />
</svg>
